name: Testes com Robot Custas Eproc 1G

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Executar Testes Robot
    runs-on: self-hosted

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Executar Testes Eproc 1G
        run: |
          robot -d reports robot_tests/login1g.robot

      - name: Salvar Relatórios de Teste (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-reports
          path: reports
